# Workspace root. Both crates share one dependency set, one lockfile and one
# target directory, so they can never drift apart on a version.

[workspace]
resolver = "3"
members = ["notif-slack", "notif-tg"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "http2",
    "rustls",
    "charset",
    "system-proxy",
    "query",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
